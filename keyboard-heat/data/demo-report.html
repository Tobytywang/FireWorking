<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键盘热度报告</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:rgba(0,0,0,.09); --line-soft:rgba(0,0,0,.05);
  --fg:#191b21; --fg2:#5d6373; --fg3:#8b91a1; --accent:#2f6fd0; --accent-soft:#e8f0fc;
}
:root[data-theme="dark"]{
  --bg:#12141a; --card:#1b1e25; --line:rgba(255,255,255,.1); --line-soft:rgba(255,255,255,.05);
  --fg:#eef0f5; --fg2:#a2a8b6; --fg3:#767c8b; --accent:#5b9bf0; --accent-soft:#1b2837;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg); padding:0 0 60px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.hdr{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.hdr h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
.hdr .range{font-size:12px;color:var(--fg3);font-family:Consolas,monospace}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{
  font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;
  background:var(--card);color:var(--fg2);border:1px solid var(--line);transition:.15s;
}
button:hover{color:var(--fg);border-color:var(--fg3)}
button.primary{background:var(--accent-soft);color:var(--accent);border-color:transparent}
button.primary:hover{color:var(--accent);border-color:var(--accent)}
section{margin-top:34px}
h2{font-size:13px;font-weight:600;color:var(--fg2);margin:0 0 14px;letter-spacing:.03em}
h2 span{color:var(--fg3);font-weight:400;margin-left:8px;font-size:12px;letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--fg3);margin-bottom:6px}
.stat .v{font-size:23px;font-weight:600;font-family:Consolas,monospace;letter-spacing:-.01em}
.stat .v small{font-size:12px;font-weight:400;color:var(--fg3);margin-left:3px;font-family:inherit;letter-spacing:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg3);margin-top:12px;justify-content:flex-end}
.legend i{width:11px;height:11px;border-radius:2.5px;display:inline-block}
.cal-scroll{overflow-x:auto;padding-bottom:4px}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.cell{width:13px;height:13px;border-radius:2.5px;background:var(--line-soft);cursor:pointer;transition:outline .1s}
.cell[data-lv="1"]{background:#a8d3f2}
.cell[data-lv="2"]{background:#5aa7d8}
.cell[data-lv="3"]{background:#3f8f4e}
.cell[data-lv="4"]{background:#e0a92c}
.cell[data-lv="5"]{background:#d94a3d}
.cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.cell:hover{outline:1.5px solid var(--fg3);outline-offset:1px}
.cal-months{display:grid;grid-auto-flow:column;grid-template-rows:16px;gap:3px;width:max-content;margin-bottom:6px}
.cal-months span{font-size:11px;color:var(--fg3);white-space:nowrap}
.chart-wrap{position:relative;width:100%;height:230px}
.chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.tip{
  position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:11.5px;
  padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .1s;
  font-family:Consolas,monospace;z-index:5;
}
.bars{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;align-items:end;height:150px}
.bar{position:relative;border-radius:4px 4px 2px 2px;background:#5aa7d8;min-height:2px;cursor:default;transition:.15s}
.bar:hover{opacity:.75}
.bar.off{background:var(--line-soft)}
.bar-x{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;margin-top:8px}
.bar-x div{text-align:center;font-size:10.5px;color:var(--fg3);font-family:Consolas,monospace}
.bar-x div.hide{visibility:hidden}
.note{font-size:12px;color:var(--fg3);margin-top:16px;line-height:1.7}
.empty{text-align:center;color:var(--fg3);padding:40px 0;font-size:13px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.row .title{font-size:14px;font-weight:600;font-family:Consolas,monospace}
.row .meta{font-size:12px;color:var(--fg3)}
.spacer{margin-left:auto}
</style>
</head>
<body>
<header>
  <div class="wrap hdr">
    <h1>键盘热度报告</h1>
    <span class="range" id="hdr-range"></span>
    <div class="actions">
      <button id="btn-copy">复制摘要</button>
      <button id="btn-csv">导出 CSV</button>
      <button id="btn-theme">切换深色</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section>
    <h2>总览</h2>
    <div class="stats" id="stats"></div>
  </section>

  <section>
    <h2>日历热力图 <span>点任意一天查看当天分钟曲线</span></h2>
    <div class="panel">
      <div class="cal-scroll"><div class="cal-months" id="cal-months"></div><div class="cal" id="cal"></div></div>
      <div class="legend">
        <span>低</span>
        <i style="background:#a8d3f2"></i><i style="background:#5aa7d8"></i><i style="background:#3f8f4e"></i><i style="background:#e0a92c"></i><i style="background:#d94a3d"></i>
        <span>高</span>
      </div>
    </div>
  </section>

  <section>
    <h2>分钟级曲线 <span>每分钟击键数，也就是这一分钟的瞬时 KPM</span></h2>
    <div class="panel">
      <div class="row">
        <button id="day-prev">前一天</button>
        <span class="title" id="day-title">--</span>
        <span class="meta" id="day-meta"></span>
        <span class="spacer"></span>
        <button id="day-next">后一天</button>
      </div>
      <div class="chart-wrap">
        <canvas id="tl" role="img" aria-label="当日每分钟击键数曲线"></canvas>
        <div class="tip" id="tl-tip"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>小时分布 <span>按小时汇总，看一天里精力集中在哪几段</span></h2>
    <div class="panel">
      <div class="bars" id="bars"></div>
      <div class="bar-x" id="bar-x"></div>
    </div>
  </section>

  <p class="note">
    数据说明：本报告只包含「每分钟击键次数 / 退格次数 / 活跃秒数」三类聚合计数，
    不含任何按键内容、窗口标题或进程信息。全部数据存放于本地 SQLite 文件，不联网上传。
  </p>
</div>

const lvOf = (v) => v <= 0 ? 0 : Math.min(5, 1 + Math.floor(Math.sqrt(v / maxDayKeys) * 4.999));

for(const k of DAY_KEYS){
  const t = dayTotals(k);
  ALL_KEYS += t.keys; ALL_BS += t.bs; ALL_ACT += t.act;
  if(t.keys > BEST_KEYS){ BEST_KEYS = t.keys; BEST_DAY = k; }
}

function renderStats(){
  const hours = ALL_ACT / 3600;
  const activeMin = DAY_KEYS.reduce((a,k)=> a + dataMinute(k).filter(r=>r[1]>0).length, 0);
  const avgKpm = activeMin ? Math.round(ALL_KEYS / activeMin) : 0;
  const bsRate = (ALL_KEYS + ALL_BS) ? (ALL_BS / (ALL_KEYS + ALL_BS) * 100) : 0;
  const perDay = DAY_KEYS.length ? Math.round(ALL_KEYS / DAY_KEYS.length) : 0;
  const items = [
    ['总击键数', fmt(ALL_KEYS), ''],
    ['活跃时长', hours.toFixed(1), '小时'],
    ['日均击键', fmt(perDay), ''],
    ['活跃时段均速', fmt(avgKpm), 'KPM'],
    ['退格占比', bsRate.toFixed(1), '%'],
    ['最热一天', BEST_DAY ? BEST_DAY.slice(5) : '--', BEST_DAY ? fmt(BEST_KEYS) : ''],
  ];
  document.getElementById('stats').innerHTML = items.map(([k,v,u])=>
    '<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+(u?'<small>'+u+'</small>':'')+'</div></div>'
  ).join('');
}

function renderCalendar(){
  const cal = document.getElementById('cal');
  if(!DAY_KEYS.length){ cal.innerHTML=''; return; }
  const first = parseD(DAY_KEYS[0]);
  const last  = parseD(DAY_KEYS[DAY_KEYS.length-1]);
  const start = new Date(first); start.setDate(start.getDate() - ((start.getDay()+6)%7));
  const end   = new Date(last);  end.setDate(end.getDate() + (6-((end.getDay()+6)%7)));

  const cells=[], months=[];
  let cur = new Date(start), week = 0, lastMonth = -1;
  const maxKey = DAY_KEYS[DAY_KEYS.length-1];
  while(cur <= end){
    const k = dstr(cur);
    const t = DATA[k] ? dayTotals(k) : null;
    const lv = t ? lvOf(t.keys) : 0;
    const cls = 'cell' + (k === selectedDay ? ' sel' : '');
    cells.push('<div class="'+cls+'" data-lv="'+lv+'" data-d="'+k+'" title="'+k+(t?(' · '+fmt(t.keys)+' 次击键'):' · 无数据')+'"></div>');
    if(cur.getDay() === 0){
      const m = cur.getMonth();
      if(m !== lastMonth){
        months.push({week, label:(m+1)+'月'});
        lastMonth = m;
      }
      week++;
    }
    cur.setDate(cur.getDate()+1);
  }
  cal.innerHTML = cells.join('');
  document.getElementById('cal-months').innerHTML = months.map(m=>
    '<span style="position:relative;left:'+(m.week*16)+'px;position:absolute">'+m.label+'</span>'
  ).join('');
  cal.querySelectorAll('.cell').forEach(el=>{
    el.addEventListener('click', ()=>{
      const d = el.dataset.d;
      if(DATA[d]) selectDay(d);
    });
  });
}

let selectedDay = META.last_day || (DAY_KEYS.length ? DAY_KEYS[DAY_KEYS.length-1] : '');

function selectDay(k){
  selectedDay = k;
  const idx = DAY_KEYS.indexOf(k);
  document.getElementById('day-title').textContent = k + ' 周' + '日一二三四五六'[parseD(k).getDay()];
  const t = dayTotals(k);
  const activeMin = dataMinute(k).filter(r=>r[1]>0).length;
  document.getElementById('day-meta').textContent =
    fmt(t.keys) + ' 次击键 · ' + (t.act/3600).toFixed(1) + ' 小时活跃 · ' + fmt(activeMin) + ' 个活跃分钟';
  document.getElementById('day-prev').disabled = idx <= 0;
  document.getElementById('day-next').disabled = idx < 0 || idx >= DAY_KEYS.length-1;
  drawTimeline(k);
  drawBars(k);
  document.querySelectorAll('.cell').forEach(el=> el.classList.toggle('sel', el.dataset.d === k));
}

document.getElementById('day-prev').onclick = ()=>{ const i=DAY_KEYS.indexOf(selectedDay); if(i>0) selectDay(DAY_KEYS[i-1]); };
document.getElementById('day-next').onclick = ()=>{ const i=DAY_KEYS.indexOf(selectedDay); if(i>=0 && i<DAY_KEYS.length-1) selectDay(DAY_KEYS[i+1]); };

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawTimeline(k){
  const cvs = document.getElementById('tl');
  const wrap = cvs.parentElement;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  cvs.width = Math.max(1, W*dpr); cvs.height = Math.max(1, H*dpr);
  const ctx = cvs.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const padL=46, padR=10, padT=14, padB=26;
  const pw = W-padL-padR, ph = H-padT-padB;

  const series = new Float64Array(1440);
  for(const r of dataMinute(k)) series[r[0]] = r[1];
  let yMax = 1;
  for(let i=0;i<1440;i++) yMax = Math.max(yMax, series[i]);
  yMax = Math.ceil(yMax*1.15/20)*20 || 20;

  const line = cssVar('--line'), fg3 = cssVar('--fg3');

  ctx.strokeStyle = line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT+ph+.5); ctx.lineTo(padL+pw, padT+ph+.5); ctx.stroke();

  ctx.font = '11px Consolas, monospace'; ctx.fillStyle = fg3;
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const v of [0, yMax/2, yMax]){
    const y = padT + ph - (v/yMax)*ph;
    ctx.fillText(String(Math.round(v)), padL-8, y);
    if(v>0){ ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(padL, y+.5); ctx.lineTo(padL+pw, y+.5); ctx.stroke(); }
  }
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let h=0; h<=24; h+=6){
    ctx.fillText(pad2(h)+':00', padL + (h*60/1439)*pw, padT+ph+7);
  }

  const X = (m)=> padL + (m/1439)*pw;
  const Y = (v)=> padT + ph - (v/yMax)*ph;

  ctx.beginPath();
  ctx.moveTo(X(0), Y(series[0]));
  for(let m=1;m<1440;m++) ctx.lineTo(X(m), Y(series[m]));
  const grad = ctx.createLinearGradient(0, padT, 0, padT+ph);
  grad.addColorStop(0, 'rgba(90,167,216,.30)');
  grad.addColorStop(1, 'rgba(90,167,216,.02)');
  ctx.lineTo(X(1439), Y(0)); ctx.lineTo(X(0), Y(0)); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(X(0), Y(series[0]));
  for(let m=1;m<1440;m++) ctx.lineTo(X(m), Y(series[m]));
  ctx.strokeStyle = '#3f86c4'; ctx.lineWidth = 1.6; ctx.lineJoin='round'; ctx.stroke();

  cvs._geo = {padL, padT, pw, ph, yMax, series};
}

function drawBars(k){
  const hourly = new Array(24).fill(0);
  const hourlyAct = new Array(24).fill(0);
  for(const r of dataMinute(k)){ hourly[Math.floor(r[0]/60)] += r[1]; hourlyAct[Math.floor(r[0]/60)] += r[3]; }
  let mx = 1; for(const v of hourly) mx = Math.max(mx, v);
  const bars = document.getElementById('bars');
  bars.innerHTML = hourly.map((v,h)=>{
    const pct = v ? Math.max(3, v/mx*100) : 0;
    const title = pad2(h)+':00 — '+fmt(v)+' 次击键，'+(hourlyAct[h]/60).toFixed(0)+' 分钟活跃';
    return '<div class="bar'+(v?'':' off')+'" style="height:'+(v?pct:2)+'%" title="'+title+'"></div>';
  }).join('');
  const bx = document.getElementById('bar-x');
  bx.innerHTML = hourly.map((_,h)=> '<div'+(h%3?' class="hide"':'')+'>'+(h%3===0?pad2(h):'')+'</div>').join('');
}

const tip = document.getElementById('tl-tip');
document.getElementById('tl').addEventListener('mousemove', (e)=>{
  const cvs = e.currentTarget, g = cvs._geo;
  if(!g) return;
  const rect = cvs.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  if(mx < g.padL || mx > g.padL+g.pw){ tip.style.opacity = 0; return; }
  const m = Math.round((mx-g.padL)/g.pw*1439);
  const v = g.series[m];
  tip.textContent = hhmm(m) + '  ' + v + ' KPM';
  tip.style.opacity = 1;
  tip.style.left = Math.min(rect.width-110, Math.max(0, mx+12)) + 'px';
  tip.style.top = Math.max(0, e.clientY - rect.top - 34) + 'px';
});
document.getElementById('tl').addEventListener('mouseleave', ()=>{ tip.style.opacity = 0; });

document.getElementById('btn-copy').onclick = ()=>{
  const hours = (ALL_ACT/3600).toFixed(1);
  const activeMin = DAY_KEYS.reduce((a,k)=> a + dataMinute(k).filter(r=>r[1]>0).length, 0);
  const avgKpm = activeMin ? Math.round(ALL_KEYS/activeMin) : 0;
  const txt = [
    '键盘热度报告 ' + META.range,
    '总击键数：' + fmt(ALL_KEYS),
    '活跃时长：' + hours + ' 小时',
    '日均击键：' + fmt(DAY_KEYS.length ? Math.round(ALL_KEYS/DAY_KEYS.length) : 0),
    '活跃时段均速：' + fmt(avgKpm) + ' KPM',
    '退格占比：' + ((ALL_KEYS+ALL_BS)?(ALL_BS/(ALL_KEYS+ALL_BS)*100).toFixed(1):'0') + '%',
    '最热一天：' + (BEST_DAY || '--') + '（' + fmt(BEST_KEYS) + ' 次）',
  ].join('\n');
  navigator.clipboard.writeText(txt).then(()=>{
    const b = document.getElementById('btn-copy');
    b.textContent = '已复制'; setTimeout(()=> b.textContent = '复制摘要', 1400);
  });
};

document.getElementById('btn-csv').onclick = ()=>{
  const rows = ['date,minute,keystrokes,backspaces,active_seconds'];
  for(const k of DAY_KEYS){
    for(const r of dataMinute(k)) rows.push(k + ',' + hhmm(r[0]) + ',' + r[1] + ',' + r[2] + ',' + r[3]);
  }
  const blob = new Blob(['\ufeff' + rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'keyboard-heat-' + dstr(new Date()) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

const btnTheme = document.getElementById('btn-theme');
btnTheme.onclick = ()=>{
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  btnTheme.textContent = dark ? '切换深色' : '切换浅色';
  if(selectedDay) selectDay(selectedDay);
};
if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
  document.documentElement.dataset.theme = 'dark';
  btnTheme.textContent = '切换浅色';
}

let rt;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ if(selectedDay) selectDay(selectedDay); }, 120); });

document.getElementById('hdr-range').textContent = META.range ? (META.range + ' · ' + DAY_KEYS.length + ' 天') : '暂无数据';

if(!DAY_KEYS.length){
  document.querySelectorAll('.panel').forEach(p=> p.innerHTML = '<div class="empty">还没有采集到数据。先运行程序打一会儿字，再点托盘图标重新生成报告。</div>');
  document.getElementById('stats').innerHTML = '';
} else {
  renderStats();
  renderCalendar();
  selectDay(selectedDay);
}
</script>
